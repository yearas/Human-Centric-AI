{% extends 'base.html' %}

{% block content %}
<div class="box">
    <div class="title-container">
        <div class="title">Upload a CSV File</div>
    </div>
    <div class="main-text">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="button-container">
                <button type="submit">Upload</button>
            </div>
        </form>

        <div class="button-container">
            <a href="{% url 'home:index' %}">
                <button type="button">Return to Homepage</button>
            </a>
        </div>

        {% if form.errors %}
            <p style="color: red;">{{ form.errors }}</p>
        {% endif %}
    </div>
</div>
{% endblock %}
